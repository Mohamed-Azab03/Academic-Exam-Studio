<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Academic Exam Studio</title><style>
:root{font:16px system-ui,Arial;color:#182a45;background:#f2f5fb}*{box-sizing:border-box}body{margin:0}header{background:#122746;color:white;padding:18px max(20px,calc((100vw - 980px)/2))}header strong{font-size:20px}header span{font-size:13px;color:#bfd0e5}main{max-width:990px;margin:44px auto;padding:0 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:22px}.card{background:#fff;padding:32px;border-radius:18px;border:1px solid #e0e8f4;box-shadow:0 14px 35px #12274610}h1{font-size:31px;line-height:1.2}h2{font-size:23px}p{line-height:1.6;color:#60718c}.eyebrow{color:#1b60be;font-size:12px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}label{font-weight:600;font-size:14px;display:block;margin-top:18px}input{font:inherit;width:100%;padding:13px;border:1px solid #c6d3e3;border-radius:9px;margin-top:8px}button{background:#265dc0;border:0;color:white;padding:13px;border-radius:9px;font:inherit;font-weight:bold;width:100%;margin-top:20px;cursor:pointer}footer{color:#8493a9;font-size:12px;text-align:center;margin:25px}@media(max-width:690px){main{grid-template-columns:1fr;margin:20px auto}.card{padding:23px}}
</style></head><body><header>🎓 &nbsp;<strong>Academic Exam Studio</strong> <span>University assessment portal</span></header><main><section class="card"><span class="eyebrow">Instructor-led assessments</span><h1>Research Methodology</h1><p>Enter the credentials given by your instructor to access your scheduled examination.</p><p>The examination begins only after your access is verified.</p></section><section class="card"><h2>Student access</h2><form method="get" action="https://script.google.com/macros/s/AKfycbw0J1tLEC-hFPVKkiyZBw16z6p0yj5YzG8RiAGe7qqf4D1wHP8uHDQKe4FYUC2G0Kwp/exec"><label for="studentId">Student ID</label><input id="studentId" name="studentId" required pattern="[A-Za-z0-9_-]{1,60}" autocomplete="off" placeholder="Your student ID"><label for="examCode">Exam Code</label><input id="examCode" name="examCode" type="password" required autocomplete="off" placeholder="Provided by instructor"><button type="submit">Enter exam →</button></form></section></main><footer>Academic Exam Studio</footer></body></html>
